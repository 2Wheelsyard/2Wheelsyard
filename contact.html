<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | 2Wheelsyard</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: clip;
      overflow-y: scroll;
      background-color: #0c0c0c;
    }

    @font-face {
      font-family: 'Rage Italic';
      src: url('fonts/RAGE.TTF') format('truetype');
      font-style: italic;
      font-display: swap;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      color: white;
      overflow-x: clip;
      background-color: #0c0c0c;
      background-image: url('lamas_rally_monviso_2025-347.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      position: relative;
    }
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: url('lamas_rally_monviso_2025-347.jpg') center center / cover no-repeat;
}
    /* BLUR NO TOPO */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;

background-image: url('lamas_rally_monviso_2025-347.jpg');      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;

      filter: blur(2px);

      -webkit-mask-image: linear-gradient(
        to bottom,
        black 0px,
        black 100px,
        transparent 280px
      );

      mask-image: linear-gradient(
        to bottom,
        black 0px,
        black 100px,
        transparent 280px
      );
    }

    .logo-topo {
      position: absolute;
      top: -500px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      pointer-events: none;
    }

    .logo-topo img {
      display: block;
      width: 750px;
      height: auto;
      margin-top: 0;
      filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.5));
    }

    /* MENU DESKTOP */
    nav {
      position: fixed;
      top: 25px;
      right: 50px;
      z-index: 1000;
      display: flex;
      flex-direction: row;
      gap: 50px;
      align-items: center;
      visibility: visible;
      opacity: 1;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #ccc;
    }

    .instagram img {
      width: 35px;
      height: 35px;
      filter: invert(1);
      transition: transform 0.3s ease;
      vertical-align: middle;
    }

    .instagram:hover img {
      transform: scale(1.1);
    }

    /* HAMBURGER */
    .hamburger {
      display: none;
      position: fixed;
      top: 25px;
      left: 25px;
      width: 35px;
      height: 25px;
      z-index: 1100;
      cursor: pointer;
      flex-direction: column;
      justify-content: space-between;
    }

    .hamburger div {
      width: 100%;
      height: 4px;
      background: white;
      border-radius: 5px;
      transition: 0.3s;
    }

    .hamburger.active div:nth-child(1) {
      transform: rotate(45deg) translateY(10px);
    }

    .hamburger.active div:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active div:nth-child(3) {
      transform: rotate(-45deg) translateY(-10px);
    }

    /* CONTACT CONTENT */
    .contact {
      position: relative;
      top: 250px;
      max-width: 600px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      border-radius: 15px;
      padding: 60px;
      text-align: center;
      z-index: 2;
      box-sizing: content-box;
    }

    .contact h1 {
      font-size: 70px;
      margin-bottom: 30px;
    }

    .contact p {
      font-size: 20px;
    }

    /* INSTAGRAM IN CONTACT */
    .contact .instagram img {
      width: 50px;
      height: 50px;
      filter: invert(1);
      margin-top: 20px;
    }

    /* TERMS AND LEGAL LINKS */
    .terms-link {
      text-align: center;
      margin: 300px 0 40px;
      position: relative;
      z-index: 3;
    }

    .terms-link a {
      font-size: 22px;
      color: white;
      cursor: pointer;
      text-decoration: none;
    }

    .terms-link a:hover {
      text-decoration: underline;
    }

    /* MODALS */
    #termsModal,
    #legalModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      padding: 0 15px;
      box-sizing: border-box;
    }

    .modalBox {
      background: #111;
      max-width: 700px;
      margin: 80px auto;
      padding: 30px;
      border-radius: 10px;
      max-height: 80vh;
      overflow-y: auto;
      border: 1px solid #333;
      box-sizing: border-box;
      color: white;
    }

    .modalBox button {
      background: none;
      border: none;
      color: white;
      font-size: 14px;
      cursor: pointer;
      float: right;
    }

    .modalBox h2 {
      clear: both;
      padding-top: 15px;
    }

    .modalContent {
      white-space: normal;
      line-height: 1.7;
    }

    .modalContent h1,
    .modalContent h2,
    .modalContent h3 {
      color: white;
    }

    .modalContent p,
    .modalContent li {
      line-height: 1.7;
    }

    .modalContent a {
      color: white;
    }

    /* LEGAL CONTENT FORMATTING */
    .modalContent {
      color: #e5e5e5;
      font-size: 15px;
      line-height: 1.8;
      overflow-wrap: break-word;
    }

    .modalContent h1 {
      font-size: 30px;
      color: #ffffff;
      line-height: 1.3;
      margin: 10px 0 25px;
      border-bottom: 1px solid #444;
      padding-bottom: 15px;
    }

    .modalContent h2 {
      font-size: 21px;
      color: #ffffff;
      margin: 30px 0 10px;
    }

    .modalContent h3 {
      font-size: 17px;
      color: #ffffff;
      margin: 22px 0 8px;
    }

    .modalContent p {
      margin: 0 0 16px;
    }

    .modalContent strong {
      color: #ffffff;
      font-weight: 600;
    }

    .modalContent ul,
    .modalContent ol {
      padding-left: 25px;
      margin: 10px 0 20px;
    }

    .modalContent li {
      margin-bottom: 8px;
    }

    .modalContent a {
      color: #ffffff;
      text-decoration: underline;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .hamburger {
        display: flex;
      }

      .logo-topo {
        top: -350px;
        left: 50%;
        transform: translateX(-50%);
      }

      .logo-topo img {
        width: 420px;
        height: auto;
        margin-top: -100px;
      }

      nav {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh;
        box-sizing: border-box;
        background: rgba(0, 0, 0, 0.95);
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 30px;
        display: flex;
        right: auto;
        transform: translateX(100%);
        transition: transform 0.4s ease;
        z-index: 1000;
      }

      nav.show {
        transform: translateX(0);
      }

      nav a {
        font-size: 26px;
      }

      .contact {
        top: 0;
        margin: 180px auto 40px;
        width: 85%;
        max-width: none;
        padding: 30px;
        box-sizing: border-box;
      }

      .contact h1 {
        font-size: 50px;
      }

      .contact p {
        font-size: 20px;
      }

      .terms-link {
        margin: 20px 0 30px;
      }

      .terms-link a {
        font-size: 18px;
      }

      .modalBox {
        margin: 40px auto;
        padding: 20px;
        max-height: 85vh;
      }

      .modalContent {
        font-size: 14px;
        line-height: 1.7;
      }

      .modalContent h1 {
        font-size: 25px;
      }

      .modalContent h2 {
        font-size: 19px;
        margin-top: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="hamburger" id="hamburger"
       aria-label="Open menu"
       aria-expanded="false">
    <div></div>
    <div></div>
    <div></div>
  </div>

  <div class="logo-topo">
    <img src="2WheelsyardIrageitalic.png" alt="Logotipo 2Wheelsyard">
  </div>

  <nav id="menu">
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="https://www.etsy.com/de/shop/2wheelsyard"
       target="_blank"
       rel="noopener noreferrer">Shop</a>
    <a href="contact.html">Contact</a>
    <a href="https://www.instagram.com/2wheelsyard"
       target="_blank"
       rel="noopener noreferrer"
       class="instagram">
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg"
           alt="Instagram">
    </a>
  </nav>

  <div class="contact">
    <h1>Get in touch</h1>
    <p>📍Luxembourg</p>
    <p>📧 2wheelsyard@gmail.com</p>
    <p>
      Want to be part of our journey?
      We’re actively looking for partners and brands to grow with us.
    </p>

    <a href="https://www.instagram.com/2wheelsyard"
       target="_blank"
       rel="noopener noreferrer"
       class="instagram">
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg"
           alt="Instagram">
    </a>
  </div>

  <div class="terms-link">
    <a id="openTerms" href="#">Terms &amp; Conditions</a><br>
    <a id="openLegal" href="#">Legal Notice</a>
  </div>

  <!-- TERMS AND CONDITIONS MODAL -->
  <div id="termsModal">
    <div class="modalBox">
      <button id="closeTerms" type="button">Close ✕</button>
      <div id="termsContent" class="modalContent">
        Loading Terms &amp; Conditions...
      </div>
    </div>
  </div>

  <!-- LEGAL NOTICE MODAL -->
  <div id="legalModal">
    <div class="modalBox">
      <button id="closeLegal" type="button">Close ✕</button>
      <div id="legalContent" class="modalContent">
        Loading Legal Notice...
      </div>
    </div>
  </div>

  <script>
    const hamburger = document.getElementById("hamburger");
    const menu = document.getElementById("menu");

    // Mobile menu
    hamburger.addEventListener("click", () => {
      hamburger.classList.toggle("active");
      menu.classList.toggle("show");

      hamburger.setAttribute(
        "aria-expanded",
        hamburger.classList.contains("active") ? "true" : "false"
      );
    });

    // Close mobile menu when a link is selected
    document.querySelectorAll("#menu a").forEach(link => {
      link.addEventListener("click", () => {
        hamburger.classList.remove("active");
        menu.classList.remove("show");
        hamburger.setAttribute("aria-expanded", "false");
      });
    });

    // Load content from separate HTML files
    async function loadLegalContent() {
      const pages = [
        {
          url: "terms.html",
          target: "termsContent",
          error: "Unable to load Terms & Conditions."
        },
        {
          url: "Legal-Notice.html",
          target: "legalContent",
          error: "Unable to load Legal Notice."
        }
      ];

      function escapeHTML(text) {
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function markdownToHTML(markdown) {
        const lines = markdown
          .replace(/\r\n/g, "\n")
          .split("\n");

        let html = "";
        let inList = false;

        function closeList() {
          if (inList) {
            html += "</ul>";
            inList = false;
          }
        }

        for (const rawLine of lines) {
          const line = rawLine.trim();

          if (!line) {
            closeList();
            continue;
          }

          if (/^---+$/.test(line)) {
            closeList();
            html += "<hr>";
            continue;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);

          if (heading) {
            closeList();
            const level = heading[1].length;
            html += `<h${level}>${escapeHTML(heading[2])}</h${level}>`;
            continue;
          }

          const listItem = line.match(/^[-*]\s+(.+)$/);

          if (listItem) {
            if (!inList) {
              html += "<ul>";
              inList = true;
            }

            html += `<li>${formatInline(listItem[1])}</li>`;
            continue;
          }

          closeList();
          html += `<p>${formatInline(line)}</p>`;
        }

        closeList();
        return html;
      }

      function formatInline(text) {
        let safe = escapeHTML(text);

        safe = safe.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        safe = safe.replace(/\*(.+?)\*/g, "<em>$1</em>");

        safe = safe.replace(
          /(https?:\/\/[^\s<]+)/g,
          '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
        );

        return safe;
      }

      for (const page of pages) {
        const target = document.getElementById(page.target);

        try {
          const response = await fetch(page.url);

          if (!response.ok) {
            throw new Error("HTTP error: " + response.status);
          }

          const html = await response.text();

          const parsedDocument = new DOMParser().parseFromString(
            html,
            "text/html"
          );

          target.innerHTML = markdownToHTML(
            parsedDocument.body.textContent
          );

        } catch (error) {
          console.error("Error loading " + page.url + ":", error);
          target.textContent = page.error;
        }
      }
    }

    loadLegalContent();

    // Open Terms & Conditions
    document.getElementById("openTerms").addEventListener("click", event => {
      event.preventDefault();
      document.getElementById("termsModal").style.display = "block";
    });

    // Close Terms & Conditions
    document.getElementById("closeTerms").addEventListener("click", () => {
      document.getElementById("termsModal").style.display = "none";
    });

    // Open Legal Notice
    document.getElementById("openLegal").addEventListener("click", event => {
      event.preventDefault();
      document.getElementById("legalModal").style.display = "block";
    });

    // Close Legal Notice
    document.getElementById("closeLegal").addEventListener("click", () => {
      document.getElementById("legalModal").style.display = "none";
    });

    // Close modals when clicking outside the content box
    window.addEventListener("click", event => {
      const termsModal = document.getElementById("termsModal");
      const legalModal = document.getElementById("legalModal");

      if (event.target === termsModal) {
        termsModal.style.display = "none";
      }

      if (event.target === legalModal) {
        legalModal.style.display = "none";
      }
    });

    // Close modals with the Escape key
    window.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        document.getElementById("termsModal").style.display = "none";
        document.getElementById("legalModal").style.display = "none";
      }
    });
  </script>

</body>
</html>
