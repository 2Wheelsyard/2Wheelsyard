<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2Wheelsyard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Rage Italic';
      src: url('fonts/RAGE.TTF') format('truetype');
      font-weight: normal;
      font-style: italic;
      font-display: swap;
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      color: white;
      overflow: hidden;
      position: relative;
      background: linear-gradient(to bottom, #0f0f0f 0px, #0c0c0c 80px, rgba(255,255,255,0) 150px),
        url('lamas_rally_monviso_2025-308.jpg');
      background-size: cover;
      background-position: center -5%;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    body::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.6) 105%);
      z-index: 0;
    }

    /* ====== LOGO TOPO (Unificado) ====== */
    .logo-topo {
      position: fixed;
      top: -500px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      pointer-events: none;
    }
    .logo-topo img {
      width: 750px;
      height: auto;
      filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
    }

    /* ====== NAV (Unificado) ====== */
    nav {
      position: fixed;
      top: 25px;
      right: 50px;
      z-index: 100;
      display: flex;
      gap: 50px;
      align-items: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-size: 24px;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    nav a:hover { color: #ccc; }

    .instagram img {
      width: 35px;
      height: 35px;
      filter: invert(1);
      transition: transform 0.3s ease;
      vertical-align: middle;
    }
    .instagram:hover img { transform: scale(1.2); }

    /* ====== HAMBURGER (Baseado no Contact) ====== */
    .hamburger {
      display: none;
      position: fixed;
      top: 25px;
      left: 25px;
      width: 35px;
      height: 25px;
      cursor: pointer;
      z-index: 101;
      flex-direction: column;
      justify-content: space-between;
    }
    .hamburger div {
      width: 100%;
      height: 4px;
      background-color: white;
      border-radius: 5px;
      transition: all 0.3s ease;
    }

    /* ====== LOGO LATERAL (Apenas Index) ====== */
    .logo-slot {
      position: fixed;
      bottom: -20px;
      left: 40px;
      z-index: 5;
    }
    .logo-slot img { width: 320px; height: auto; }

    @media (max-width: 768px) {
      body { overflow-y: auto; }
      .hamburger { display: flex; }
      .logo-topo { top: -125px; left: 54%; }
      .logo-topo img { width: 420px; margin-top: -100px; }
      
      nav {
        position: fixed;
        top: 0;
        right: -100%;
        width: 100%;
        height: 100vh;
        background: rgba(0, 0, 0, 0.95);
        flex-direction: column;
        justify-content: center;
        gap: 30px;
        transition: right 0.4s ease;
        right: -100%;
      }
      nav.show { right: 0; }
      .logo-slot { bottom: -50px; left: 50%; transform: translateX(-50%); }
      .logo-slot img { width: 180px; }
    }
    
    .hamburger.active div:nth-child(1) { transform: rotate(45deg) translateY(10px); }
    .hamburger.active div:nth-child(2) { opacity: 0; }
    .hamburger.active div:nth-child(3) { transform: rotate(-45deg) translateY(-10px); }
  </style>
</head>
<body>
  <div class="logo-slot"><img src="2Wheelsyardpng - Editado.png" alt="Logotipo" /></div>
  <div class="logo-topo"><img src="2WheelsyardIrageitalic.png" alt="Logotipo 2Wheelsyard" /></div>

  <div class="hamburger" id="hamburger">
    <div></div><div></div><div></div>
  </div>

  <nav id="menu">
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="shop.html">Shop</a>
    <a href="contact.html">Contact</a>
    <a href="https://www.instagram.com/2wheelsyard" target="_blank" class="instagram">
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram" />
    </a>
  </nav>

  <script>
    const hamburger = document.getElementById('hamburger');
    const menu = document.getElementById('menu');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      menu.classList.toggle('show');
    });
  </script>
</body>
</html>
